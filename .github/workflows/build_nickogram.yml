name: Build NickoGram APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build NickoGram Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Neckogram Repo
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          df -h

      - name: Fetch Nekogram Base Source
        run: |
          echo "Cloning latest Nekogram main branch..."
          git clone --depth 1 -b main https://github.com/Nekogram/Nekogram.git temp_upstream
          # Copy upstream files into workspace, preserving our scripts/ and art/
          cp -rn temp_upstream/* .
          rm -rf temp_upstream
          ls -la

      - name: Apply NickoGram Custom Patches & Icons
        run: |
          python3 scripts/apply_nickogram_patches.py

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        run: |
          echo "Installing NDK..."
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build NickoGram APK
        run: |
          echo "Building NickoGram Debug APK..."
          ./gradlew assembleDebug --no-daemon -x test

      - name: Find and Rename APK
        run: |
          mkdir -p output_apk
          find . -name "*debug*.apk" -exec cp {} output_apk/NickoGram-v1.0-debug.apk \;
          ls -la output_apk/

      - name: Upload NickoGram APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NickoGram-v1.0-debug-APK
          path: output_apk/NickoGram-v1.0-debug.apk
          retention-days: 14
